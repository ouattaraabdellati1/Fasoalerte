{% load static %}<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#0b4a2c">
  <link rel="manifest" href="/manifest.webmanifest">
  <link rel="icon" href="{% static 'core/icon-192.png' %}">
  <link rel="apple-touch-icon" href="{% static 'core/icon-192.png' %}">
  <title>{% block title %}FasoAlerte{% endblock %}</title>
  <link rel="stylesheet" href="{% static 'core/app.css' %}">
</head>
<body data-page="{% block page %}{% endblock %}">
  <header class="top">
    <img class="logo" src="{% static 'core/icon-192.png' %}" alt="" width="40" height="40">
    <div>
      <div class="brand">FasoAlerte</div>
      <div class="net"><span class="dot" id="netdot"></span><span id="nettext">Réseau actif</span></div>
    </div>
  </header>
  <main>{% block content %}{% endblock %}</main>
  <nav class="tabs" aria-label="Navigation">
    <a href="/" data-p="home"><svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 3l8 3v6c0 5-3.5 8-8 9-4.5-1-8-4-8-9V6z"/></svg>Alertes</a>
    <a href="/signaler/" data-p="report" class="main"><svg viewBox="0 0 24 24" width="24" height="24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 11v3h3l5 4V7L7 11zM16 9a4 4 0 010 6"/></svg>Signaler</a>
    <a href="/suivi/" data-p="track"><svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2"><path d="M6 3h12v18H6zM9 8h6M9 12h6M9 16h4"/></svg>Suivi</a>
    <a href="/urgences/" data-p="urgences"><svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2"><path d="M5 4h4l2 5-2 1a11 11 0 005 5l1-2 5 2v4a2 2 0 01-2 2A15 15 0 013 6a2 2 0 012-2z"/></svg>Urgences</a>
  </nav>
  <script src="{% static 'core/app.js' %}"></script>
  {% block scripts %}{% endblock %}
</body>
</html>
